version: '3.8'

services:
  # Redis Queue Broker
  redis:
    image: redis:alpine
    container_name: gitrag_redis
    ports:
      - "6379:6379"
    restart: always

  # Web Server Dashboard
  web:
    build: .
    container_name: gitrag_web
    ports:
      - "8000:8000"
    environment:
      - ROLE=server
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ENV=development
    volumes:
      - temp_data:/app/temp
    depends_on:
      - redis
    restart: always

  # Ingestion Task Worker
  worker:
    build: .
    container_name: gitrag_worker
    environment:
      - ROLE=worker
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ENV=development
    volumes:
      - temp_data:/app/temp
    depends_on:
      - redis
    restart: always

volumes:
  temp_data:
